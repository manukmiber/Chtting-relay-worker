[package]
name = "chtting-relay"
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
description = "Termux-native, stateful LLM relay: exact tokenizing, model-name translation, response reshaping, localhost dashboard, Cloudflare Tunnel"
license = "MIT"

[lib]
name = "chtting_relay"
path = "src/lib.rs"

[[bin]]
name = "chtting-relay"
path = "src/main.rs"

[dependencies]
# --- async runtime + HTTP -------------------------------------------------
# A multi-thread runtime is the whole point of the Rust port: hundreds of
# concurrent callers are spread over every core instead of one event loop.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util", "sync", "fs"] }
tokio-stream = "0.1"
# `original-uri` is what lets the dashboard know it is being served under
# `/dashboard` on the relay's port rather than at the root of its own, which
# decides the cookie path and the one redirect that makes relative asset URLs
# resolve.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path", "original-uri"] }
tower = { version = "0.5", default-features = false }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
# Only for SO_REUSEPORT, which is what lets a retiring instance hand its port to
# its replacement without refusing a single connection. Pure Rust over libc, and
# tokio already builds it, so it costs nothing extra on Android.
#
# `all` is not optional: socket2 puts `set_reuse_port` behind it, and relying on
# tokio to have switched it on for us would mean the Android build breaks the day
# tokio stops doing so.
socket2 = { version = "0.6", features = ["all"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# TLS through `ring`, never `aws-lc-rs`: aws-lc needs cmake and (sometimes) Go,
# neither of which is reasonable to require inside Termux. `ring` builds with
# the clang that `pkg install rust` already pulls in.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "charset"] }

# --- data -----------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# `bundled` compiles SQLite from source, so the relay does not depend on
# whatever libsqlite version a given Termux install happens to carry.
rusqlite = { version = "0.37", features = ["bundled"] }

# --- tokenizing -----------------------------------------------------------
# The reference implementations themselves rather than a reimplementation:
# tiktoken-rs embeds OpenAI's rank files, and `tokenizers` is HuggingFace's own
# Rust crate that the Python package is a binding for.
tiktoken-rs = "0.9"
# default features pull in `onig` (C) and `esaxx_fast` (C++); the fancy-regex
# path is pure Rust and cross-compiles to Android without extra toolchains.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

# --- misc -----------------------------------------------------------------
# For the one-relay-per-port lease in `src/lock.rs`: an abstract unix socket
# bound with `bind(2)`, and `kill(2)` to move an incumbent along. Already in the
# tree underneath tokio, socket2 and rusqlite, so naming it directly costs the
# Termux build nothing.
libc = "0.2"
# fancy-regex, not `regex`: user-written rewrite rules are JS-flavoured and do
# use lookaround, which the `regex` crate deliberately cannot express.
fancy-regex = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
rand = "0.9"
arc-swap = "1"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
subtle = "2"
percent-encoding = "2"
base64 = "0.22"
# Matches the hasher `tiktoken_rs::CoreBPE::new` expects for its rank tables.
rustc-hash = "1.1"
# Chains the usage ledger's rows together so a number that was edited behind
# the relay's back can be spotted. Pure Rust, so it cross-compiles to Android
# with no extra toolchain.
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# Lets the mock backend go quiet mid-stream, which is the only way to see
# whether the relay fills the silence with a keep-alive of its own.
async-stream = "0.3"
# The dashboard tests need a cookie jar to hold a signed-in session.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "charset", "cookies"] }

[profile.release]
# Termux builds on a phone: `thin` LTO gets most of the win for a fraction of
# the peak memory `fat` needs, and 4 codegen units keeps the build parallel.
lto = "thin"
codegen-units = 4
strip = true
# Never `abort`. A panic in one request's handler unwinds into the middleware in
# `server::catch_panics`, which logs it and answers the caller 500; aborting
# would take the other few hundred callers down with it, and on a phone that
# nobody is watching it would stay down.
panic = "unwind"

# A build on the phone itself, where the constraint is RAM rather than time: one
# codegen unit at a time and no LTO, so `cargo build` does not get the process
# killed halfway through on a 4 GB device.
#
#   cargo build --profile release-small
[profile.release-small]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 1

# The opposite end: a device with cores and memory to spare, where the build can
# afford to take longer than the phone profile and the binary should be as fast
# as the toolchain can make it.
#
#   cargo build --profile release-fast
#
# `fat` LTO and one codegen unit let the optimiser inline across crate
# boundaries — which is where the wins are here, since the hot paths run through
# `serde_json`, `tokenizers` and `tiktoken-rs` rather than through this crate.
# It needs several gigabytes of RAM and a few minutes; on anything smaller than
# a modern tablet use plain `--release`.
#
# To also target the device's own ISA, set the CPU at the same time:
#
#   RUSTFLAGS="-C target-cpu=cortex-x925" cargo build --profile release-fast
#
# See `scripts/build-android.sh --tune` for what that does and when it is safe.
[profile.release-fast]
inherits = "release"
lto = "fat"
codegen-units = 1
