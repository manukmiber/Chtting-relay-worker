name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Everything here is plain cargo, so it keeps working if the internals change
# — swapping the HTTP framework does not need a CI change.
#
# Only first-party `actions/*` are used, and the toolchain comes from the
# rustup already on the runner. A repository that restricts which actions may
# run (a common default) would refuse a workflow built on third-party ones
# before any job starts.
#
# `-D warnings` is deliberately only on the clippy step: setting it globally
# would also turn a warning inside a dependency into a build failure, so an
# upstream release could break CI without anything here changing.
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The HuggingFace vocabularies are not in the repo, so these run against
      # the built-in OpenAI ones and skip the rest — see `accuracy` below.
      - name: Tests
        run: cargo test --all-targets

  accuracy:
    name: tokenizer accuracy vs the reference implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-accuracy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-accuracy-${{ runner.os }}-

      # Compares against fixtures generated by the real Python `tiktoken` and
      # `tokenizers`. A download failure is not a code failure: the test skips
      # any vocabulary that is not present, so the job stays honest either way.
      - name: Fetch a HuggingFace vocabulary
        continue-on-error: true
        run: |
          mkdir -p data/tokenizers
          for spec in "deepseek:deepseek-ai/DeepSeek-V3" "qwen:Qwen/Qwen2.5-7B-Instruct"; do
            name="${spec%%:*}"; repo="${spec#*:}"
            curl -sSL --retry 2 --max-time 180 \
              -o "data/tokenizers/$name.tokenizer.json" \
              "https://huggingface.co/$repo/resolve/main/tokenizer.json" || true
          done
          ls -la data/tokenizers/ || true

      - name: Accuracy tests
        run: cargo test --test tokenizer -- --nocapture

  android:
    name: cross-compile for Termux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-

      # A phone is the actual deployment target, so a change that only breaks
      # there should fail here rather than on someone's device. The runner
      # already exports ANDROID_NDK_LATEST_HOME, which the script looks for.
      - name: Build for Android
        run: bash scripts/build-android.sh aarch64 armv7
