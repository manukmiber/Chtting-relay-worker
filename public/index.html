<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>chtting-relay dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛰️</text></svg>">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="dot" id="live-dot"></span>
        <span>chtting-relay</span>
        <small id="relay-port"></small>
      </div>
      <div class="spacer"></div>
      <button class="ghost sm" id="theme-toggle" title="Toggle theme">◐</button>
      <button class="ghost sm" id="refresh" title="Refresh">↻</button>
      <button class="ghost sm" id="logout" hidden>Sign out</button>
    </header>

    <nav class="tabs" id="tabs" role="tablist"></nav>
    <main id="view"></main>
  </div>

  <div id="drawer-root"></div>
  <div id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
